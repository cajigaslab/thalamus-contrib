[package]
name = "thalamus-contrib"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
chrono = "0.4"
ffmpeg-sys-next = "7"
futures = "0.3.32"
libloading = "0.8"
skia-safe = "0.87"
serde = { version = "1.0.228", features = ["derive"] }
serde_core = "1.0.228"
serde_derive = "1.0.228"
serde_json = "1.0.150"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
ash = "0.38.0"
imgui = "0.12"
imgui-rs-vulkan-renderer = "1.16"
btleplug = "0.12.0"
uuid = "1.24.1"
bytebuffer = "2.3.0"
tokio-util = { version = "0.7.19", features = ["rt"] }
nokhwa = { version = "0.10.0-rc.6", features = ["input-native"] }
cpal = "0.18"

[build-dependencies]
bindgen = "0.72"
cmake = "0.1.58"
# wgsl-in is unused, but naga 30's glsl-in doesn't compile without it or
# spv-in (a helper it calls, front::interpolator, is gated on those two).
naga = { version = "30.0.1", features = ["glsl-in", "spv-out", "wgsl-in"] }
pkg-config = "0.3"
ureq = "3.3.0"
zip = "8.6.0"

