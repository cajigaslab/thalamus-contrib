name: Build

on:
  workflow_dispatch: {}
    
permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version_bump.outputs.version }}
    steps:
    - uses: actions/checkout@v4
    - name: Set Git name 
      run: git config --global user.name "Github Actions"
    - name: Set Git email 
      run: git config --global user.email "no@email.com"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.12
    - run: sudo apt update
    - run: sudo apt install nasm libdbus-1-dev libfreetype-dev libfontconfig-dev
    - run: pip install hatch
    - name: Version Bump
      id: version_bump
      run: |
        hatch version patch
        VERSION=`hatch version`
        echo VERSION=$VERSION
        git add -u
        git commit -m "[skip ci] v$VERSION"
        git tag -a "v$VERSION" -m "[skip ci] v$VERSION"
        echo version=$VERSION >> "$GITHUB_OUTPUT"
    - run: hatch build
    - name: Archive Distribution
      uses: actions/upload-artifact@v4
      with:
        name: linux-dist
        path: dist
    - run: |
        git push
        git push --tags
  build-mac:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.12
    - run: pip install hatch
    - run: hatch version patch
    - run: hatch build
    - name: Archive Distribution
      uses: actions/upload-artifact@v4
      with:
        name: mac-dist
        path: dist
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - run: |
        echo C:\msys64\usr\bin >> $env:GITHUB_PATH
        echo C:\msys64\ucrt64\bin >> $env:GITHUB_PATH
    - run: |
        pacman --noconfirm -Syu
        pacman --noconfirm -S make
    #- run: winget install --accept-package-agreements --accept-source-agreements --disable-interactivity NASM.NASM
    - run: |
        make --version
        Get-Command make
        Get-Command perl
        Get-Command cmake
        Get-Command nasm
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.12
    - run: pip install hatch ninja
    - run: hatch version patch
    - run: hatch build
    - name: Archive Distribution
      uses: actions/upload-artifact@v4
      with:
        name: windows-dist
        path: dist
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    needs: [build-linux, build-windows, build-mac]
    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.12
    - run: pip install twine
    - uses: actions/download-artifact@v4
      with:
        name: linux-dist
    - uses: actions/download-artifact@v4
      with:
        name: windows-dist
    - uses: actions/download-artifact@v4
      with:
        name: mac-dist
    - name: Get Paths
      id: paths
      run: |
        echo linux=`ls *linux*.whl` >> "$GITHUB_OUTPUT"
        echo windows=`ls *win*.whl` >> "$GITHUB_OUTPUT"
        echo mac=`ls *mac*.whl` >> "$GITHUB_OUTPUT"
    - name: Create Release
      id: create-release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{needs.build-linux.outputs.version}}
        release_name: Release ${{needs.build-linux.outputs.version}}
        draft: false
        prerelease: false
    - name: Upload Linux Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create-release.outputs.upload_url }}
        asset_path: ${{ steps.paths.outputs.linux }}
        asset_name: ${{ steps.paths.outputs.linux }}
        asset_content_type: application/x-wheel+zip
    - name: Upload Windows Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create-release.outputs.upload_url }}
        asset_path: ${{ steps.paths.outputs.windows }}
        asset_name: ${{ steps.paths.outputs.windows }}
        asset_content_type: application/x-wheel+zip
    - name: Upload Mac Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create-release.outputs.upload_url }}
        asset_path: ${{ steps.paths.outputs.mac }}
        asset_name: ${{ steps.paths.outputs.mac }}
        asset_content_type: application/x-wheel+zip
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: twine upload *.whl
