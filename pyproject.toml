[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thalamus-contrib"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "Jarl Haggerty", email = "Jarl.Haggerty@pennmedicine.upenn.edu" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/Jarl Haggerty/thalamus-contrib#readme"
Issues = "https://github.com/Jarl Haggerty/thalamus-contrib/issues"
Source = "https://github.com/Jarl Haggerty/thalamus-contrib"

[tool.hatch.version]
path = "src/thalamus/contrib/__about__.py"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/thalamus/contrib tests}"

[tool.coverage.run]
source_pkgs = ["thalamus.contrib", "tests"]
branch = true
parallel = true
omit = [
  "src/thalamus/contrib/__about__.py",
]

[tool.coverage.paths]
thalamus_contrib = ["src/thalamus/contrib", "*/thalamus-contrib/src/thalamus/contrib"]
tests = ["tests", "*/thalamus/contrib/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
